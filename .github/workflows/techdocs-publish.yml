name: Publish TechDocs

# Builds this repo's mkdocs.yml + docs/ with @techdocs/cli and publishes
# straight to the S3-compatible TechDocs storage bucket. The backstage
# backend runs with techdocs.builder: external because it has no Docker, so
# something else has to build and publish -- see docker-apps +
# tnoff/backstage#20. Same setup as terraform-modules, github-workflows,
# hathor, enheduanna, public-transit, oci-bastion-keepalive,
# database-backup, and magic-mirror-docker.
#
# Publishes with a short-lived OCI token from this job's GitHub OIDC identity, not a
# stored S3 key (tnoff/terraform#217). OCI maps this repo's push to main to the user that
# may write only its own default/component/ prefix in the TechDocs bucket
# (terraform-admin techdocs-publishers.tf).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs-publish.yml'

concurrency:
  group: techdocs-publish
  cancel-in-progress: false

# Without this, permissions default to whatever the repo/org falls back to
# (potentially write-all) instead of being pinned explicitly. This workflow
# only reads the repo; id-token: write lets the callee mint the OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Generate and publish
    uses: tnoff/github-workflows/.github/workflows/techdocs-publish-oidc.yml@59bd35d1dc06c8de1b74210b4aed7f03862ca1f2  # techdocs-publish-oidc-v1.0.0
    with:
      entity_ref: default/Component/oke-scan
      techdocs_bucket_name: backstage_techdocs
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
