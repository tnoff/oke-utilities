name: CI

# Pull-request checks, ported from .gitlab-ci.yml's pr-check and test stages.
# Shared jobs come from tnoff/github-workflows, SHA-pinned the same way the
# GitLab `include:` refs were; Renovate's github-actions manager keeps the
# pins current.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase
# (rebaseWhen: behind-base-branch), and without this every rebase leaves its
# predecessor running to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR that touches only catalog-info.yaml or renovate.json changes nothing any
  # job here inspects: no source, no image input, no packaging metadata, no
  # workflow. So all of them gate on this and CI reduces to the aggregate.
  #
  # This MUST stay a job-level `if:` and never become a workflow-level
  # `paths-ignore`. The branch ruleset requires the `CI result` context;
  # `paths-ignore` stops the whole workflow, so that context never reports at all
  # -- and a required check that never reports blocks the PR forever, where a
  # SKIPPED job scores as success. The two failure modes look nothing alike.
  #
  # Two files, named exactly, anchored. Not a prefix, not a glob, not a
  # deny-list of "things that feel unimportant": a list that grows by feel is one
  # somebody eventually adds a file to that did matter.
  #
  # An empty or unreadable diff yields false, which runs everything.
  metadata:
    name: Detect metadata-only change
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      only: ${{ steps.filter.outputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          ONLY=false
          if [ -n "${FILES}" ]; then
            OTHER="$(printf '%s\n' "${FILES}" | grep -vE '^(catalog-info\.yaml|renovate\.json)$' || true)"
            [ -z "${OTHER}" ] && ONLY=true
          fi
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "metadata-only: ${ONLY}"
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Scan for secrets
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # trufflehog-v1.0.0

  # extra_apt is deliberately empty. The GitLab job ran on ci-base-images,
  # advertised as "git + ffmpeg + postgresql", but that was the fleet-wide
  # Python base rather than this repo's requirement -- kubernetes, oci,
  # requests, python-gitlab, dappertable and the OpenTelemetry SDK are all
  # pure-Python wheels, and nothing here touches ffmpeg or a database.
  tox:
    name: Tox
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/tox.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # tox-v1.0.0

  # Reimplements .image-build-rules' `changes:` block: only rebuild when
  # something baked into the image changed. Doc-only, renovate.json and
  # workflow-pin PRs skip the build, exactly as on GitLab.
  #
  # Done with git rather than a path-filter action to avoid another pinned
  # dependency for ~10 lines of shell. A workflow-level `paths:` filter would
  # be wrong: it would gate the secret scan, the tox matrix and bump-version too.
  changes:
    name: Detect image-input changes
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      secret_age_image: ${{ steps.filter.outputs.secret_age_image }}
      ocir_cleanup_image: ${{ steps.filter.outputs.ocir_cleanup_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Three images, three independent filters -- not a matrix. packages/core
      # is shared by all three, so a change there flips every flag. See
      # discord-bot's measured-import-closure module for what this looks
      # like at six images, and don't reach for that machinery before it's
      # needed.
      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          IMAGE=false
          SECRET_AGE_IMAGE=false
          OCIR_CLEANUP_IMAGE=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              packages/core/*|packages/scan/*) IMAGE=true ;;
            esac
            case "$f" in
              packages/core/*|packages/secret_age/*) SECRET_AGE_IMAGE=true ;;
            esac
            case "$f" in
              packages/core/*|packages/ocir_cleanup/*) OCIR_CLEANUP_IMAGE=true ;;
            esac
          done <<< "${FILES}"
          echo "image inputs changed: ${IMAGE}"
          echo "secret-age image inputs changed: ${SECRET_AGE_IMAGE}"
          echo "ocir-cleanup image inputs changed: ${OCIR_CLEANUP_IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "secret_age_image=${SECRET_AGE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ocir_cleanup_image=${OCIR_CLEANUP_IMAGE}" >> "$GITHUB_OUTPUT"

  # GitLab ran the build and the image scan as two jobs, shipping the image
  # between them as a tarball through an object-storage bucket.
  # docker-build-check does both in one job, so the bucket, the upload and the
  # download are gone.
  #
  # NOTE: conditional, so it must never be added to required_status_checks --
  # a required check that skips blocks the merge.
  build:
    name: Build and scan image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # docker-build-check-v1.0.0
    with:
      dockerfile: packages/scan/Dockerfile

  build-secret-age:
    name: Build and scan secret-age image
    needs: changes
    if: needs.changes.outputs.secret_age_image == 'true'
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # docker-build-check-v1.0.0
    with:
      dockerfile: packages/secret_age/Dockerfile

  build-ocir-cleanup:
    name: Build and scan ocir-cleanup image
    needs: changes
    if: needs.changes.outputs.ocir_cleanup_image == 'true'
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # docker-build-check-v1.0.0
    with:
      dockerfile: packages/ocir_cleanup/Dockerfile

  bump-version:
    name: Bump version
    # Matches the GitLab rule. The dev- prefix comes from the shared renovate
    # python preset and is load-bearing: it is what decides whether an update
    # bumps VERSION, writes a changelog fragment, and therefore cuts a release.
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # bump-version-v1.0.0
    with:
      bump_changelog: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # check-workflow-contracts-v1.0.0

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # Tox is the sharp case: its matrix legs come from `tox -l` at runtime,
    # so naming `tox (3.13)` couples this ruleset to a file in another repo,
    # and a required check that never reports blocks merging with no failing
    # job to point at.
    #
    # The image build is conditional on `changes`, so it is `skipped` on a
    # PR that touches no image input -- correct, and why skipped passes below.
    # It is also why the build legs must never be required by name: they
    # would pass vacuously.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, tox, changes, build, build-secret-age, build-ocir-cleanup, contracts, metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:            ${{ needs.secrets.result }}"
          echo "metadata:           ${{ needs.metadata.result }}"
          echo "tox:                ${{ needs.tox.result }}"
          echo "changes:            ${{ needs.changes.result }}"
          echo "build:              ${{ needs.build.result }}"
          echo "build-secret-age:   ${{ needs['build-secret-age'].result }}"
          echo "build-ocir-cleanup: ${{ needs['build-ocir-cleanup'].result }}"
          echo "contracts:          ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.tox.result == 'failure' || needs.tox.result == 'cancelled' ||
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
          needs['build-secret-age'].result == 'failure' || needs['build-secret-age'].result == 'cancelled' ||
          needs['build-ocir-cleanup'].result == 'failure' || needs['build-ocir-cleanup'].result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled' ||
          needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
