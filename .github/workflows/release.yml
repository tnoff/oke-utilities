name: Release

# Default-branch pipeline: fold the changelog, tag, push the image, and ask
# docker-apps to bump its pin.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag, because tag defers while fragments are still pending.
#
# The image must NOT be pushed twice and docker-apps must not be asked to bump
# twice. GitLab guarded this with .not-on-changelog-fold matching the commit
# message; this is the same guard. Without it the fold commit is byte-identical
# in the image context, so the push skips the tag write on a shared digest and
# trigger-bump pins docker-apps at a tag that was never written.
#
# There is no release job: the GitLab config included no release template.
#
# ---------------------------------------------------------------------------
# Per-package versions
# ---------------------------------------------------------------------------
# Every package under packages/ has its own VERSION and CHANGELOG.md and is
# tagged <pkg>-vX.Y.Z (core-v0.3.0, scan-v0.1.0, ...). The root VERSION and
# the v* tag stream stopped at v0.10.19. assemble-changelog folds each
# package's own changelog.d/ into its own CHANGELOG.md, all in one commit. The
# shared tag.yml reads a single version file and tags plain vX.Y.Z, so tagging
# is done inline by the `tag` job below.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Skip the image build when the commit did not touch anything the image is
  # built from. Without this a metadata-only merge -- a catalog descriptor, a
  # README -- folds a changelog, cuts a tag, rebuilds the image and bumps a
  # production pin in docker-apps for content no image contains.
  #
  # The same filter already exists in ci.yml as the `changes` job, and it works:
  # the build correctly skips on a docs-only PR. It was never wired into the
  # release path, so the saving stopped at the PR and the merge rebuilt anyway.
  # That is the shape worth remembering -- a control present where you watch the
  # checks and absent where the work actually happens.
  #
  # The keep-list below is copied from ci.yml's `changes` job and must stay
  # identical to it. If the two drift, a PR can build an image that its own merge
  # then refuses to rebuild.
  #
  # Two differences from ci.yml's copy, both forced by the event: the base is
  # github.event.before compared two-dot rather than a PR base ref, and this one
  # FAILS OPEN. An absent, all-zeros or unreachable base builds anyway. A build
  # that did not need to happen costs minutes; a build that silently did not
  # happen leaves docker-apps pinned to a stale image and reads exactly like a
  # successful run.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      secret_age_image: ${{ steps.filter.outputs.secret_age_image }}
      ocir_cleanup_image: ${{ steps.filter.outputs.ocir_cleanup_image }}
      jwks_publisher_image: ${{ steps.filter.outputs.jwks_publisher_image }}
      rpst_sidecar_image: ${{ steps.filter.outputs.rpst_sidecar_image }}
      audit_watch_image: ${{ steps.filter.outputs.audit_watch_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Keep in lockstep with ci.yml's copy of this filter -- see that file's
      # header comment on why drift here is the way an image ships that its
      # own merge then refuses to rebuild.
      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base ref (${BEFORE:-empty}) -- building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "secret_age_image=true" >> "$GITHUB_OUTPUT"
            echo "ocir_cleanup_image=true" >> "$GITHUB_OUTPUT"
            echo "jwks_publisher_image=true" >> "$GITHUB_OUTPUT"
            echo "rpst_sidecar_image=true" >> "$GITHUB_OUTPUT"
            echo "audit_watch_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          IMAGE=false
          SECRET_AGE_IMAGE=false
          OCIR_CLEANUP_IMAGE=false
          JWKS_PUBLISHER_IMAGE=false
          RPST_SIDECAR_IMAGE=false
          AUDIT_WATCH_IMAGE=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              packages/scan/*) IMAGE=true ;;
            esac
            case "$f" in
              packages/secret_age/*) SECRET_AGE_IMAGE=true ;;
            esac
            case "$f" in
              packages/ocir_cleanup/*) OCIR_CLEANUP_IMAGE=true ;;
            esac
            case "$f" in
              packages/jwks_publisher/*) JWKS_PUBLISHER_IMAGE=true ;;
            esac
            case "$f" in
              packages/rpst_sidecar/*) RPST_SIDECAR_IMAGE=true ;;
              packages/audit_watch/*) AUDIT_WATCH_IMAGE=true ;;
            esac
          done <<< "${FILES}"
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "image inputs changed: ${IMAGE}"
          echo "secret-age image inputs changed: ${SECRET_AGE_IMAGE}"
          echo "ocir-cleanup image inputs changed: ${OCIR_CLEANUP_IMAGE}"
          echo "jwks-publisher image inputs changed: ${JWKS_PUBLISHER_IMAGE}"
          echo "rpst-sidecar image inputs changed: ${RPST_SIDECAR_IMAGE}"
          echo "audit-watch image inputs changed: ${AUDIT_WATCH_IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "secret_age_image=${SECRET_AGE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ocir_cleanup_image=${OCIR_CLEANUP_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "jwks_publisher_image=${JWKS_PUBLISHER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "rpst_sidecar_image=${RPST_SIDECAR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "audit_watch_image=${AUDIT_WATCH_IMAGE}" >> "$GITHUB_OUTPUT"

  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # assemble-changelog-v1.1.1
    with:
      version_files_command: .github/scripts/package-version-files.sh all
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Same contract as the shared tag.yml with gate_on_fragments, per package:
  # while ANY package still has fragments pending, defer -- assemble-changelog
  # is about to push the fold commit, and that run tags against the assembled
  # changelogs. Then tag each package whose <pkg>-v<VERSION> does not exist
  # yet. Idempotent: a re-run, or a merge that bumped nothing, tags nothing.
  tag:
    name: Tag packages
    needs: assemble-changelog
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # Pushes the tags as the tnoff-ci App, the same identity the shared
      # tag.yml uses, so the tag ruleset's bypass applies unchanged.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag
        run: |
          set -euo pipefail
          if compgen -G 'packages/*/changelog.d/*.md' >/dev/null; then
            echo "Changelog fragments pending -- deferring tags to the post-assemble run:"
            compgen -G 'packages/*/changelog.d/*.md' | sed 's/^/  /'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          while IFS= read -r vfile; do
            pkg="$(basename "$(dirname "${vfile}")")"
            tag="${pkg}-v$(tr -d '[:space:]' < "${vfile}")"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "Tag ${tag} already exists -- skipping"
              continue
            fi
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
            echo "Tag ${tag} created"
          done < <(.github/scripts/package-version-files.sh all)

  push-image:
    name: Push image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    # registry / namespace / repo_name are INPUTS, not secrets. GitHub refuses
    # to set a job output containing secret material, so as secrets the `image`
    # output below comes back EMPTY and trigger-bump sends a blank IMAGE_NAME.
    # See github-workflows!98.
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: oke-scan
      dockerfile: packages/scan/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump:
    name: Trigger docker-apps bump
    needs: push-image
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the pin in docker-apps apps/security-scanner/cronjob.yaml.
    with:
      bump_source: oke-scan
      image: ${{ needs.push-image.outputs.image }}
      image_tag: ${{ needs.push-image.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # A separate explicit job, not a matrix leg: matrix job outputs aren't
  # addressable per-leg (needs.push.outputs[matrix.image] doesn't exist), and
  # trigger-bump needs the exact tag its own paired push produced -- deriving
  # that independently is how a pin ends up pointing at a tag that was never
  # written. Same shape discord-bot uses for its own per-image push/bump pairs.
  push-image-secret-age:
    name: Push secret-age image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.secret_age_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: secret_age_tracker
      dockerfile: packages/secret_age/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump-secret-age:
    name: Trigger docker-apps bump (secret-age)
    needs: push-image-secret-age
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the pin in docker-apps apps/security-scanner/secret-age-tracker-cronjob.yaml.
    with:
      bump_source: secret-age-tracker
      image: ${{ needs.push-image-secret-age.outputs.image }}
      image_tag: ${{ needs.push-image-secret-age.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  push-image-ocir-cleanup:
    name: Push ocir-cleanup image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.ocir_cleanup_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ocir_cleanup
      dockerfile: packages/ocir_cleanup/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump-ocir-cleanup:
    name: Trigger docker-apps bump (ocir-cleanup)
    needs: push-image-ocir-cleanup
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the pin in docker-apps images/kustomization.yaml for the
    # ocir_cleanup image, consumed by
    # apps/security-scanner/ocir-cleanup-cronjob.yaml (renamed from
    # cleanup-all.yaml).
    with:
      bump_source: ocir-cleanup
      image: ${{ needs.push-image-ocir-cleanup.outputs.image }}
      image_tag: ${{ needs.push-image-ocir-cleanup.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Pin: images/kustomization.yaml (iad.ocir.io/tnoff/jwks_publisher), bumped by the job below.
  push-image-jwks-publisher:
    name: Push jwks-publisher image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.jwks_publisher_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf, which names jwks_publisher).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: jwks_publisher
      dockerfile: packages/jwks_publisher/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump-jwks-publisher:
    name: Trigger docker-apps bump (jwks-publisher)
    needs: push-image-jwks-publisher
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the jwks_publisher pin in docker-apps images/kustomization.yaml (apps/jwks-publisher).
    with:
      bump_source: jwks-publisher
      image: ${{ needs.push-image-jwks-publisher.outputs.image }}
      image_tag: ${{ needs.push-image-jwks-publisher.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Pin: images/kustomization.yaml (iad.ocir.io/tnoff/rpst_sidecar), bumped by the job below.
  push-image-rpst-sidecar:
    name: Push rpst-sidecar image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.rpst_sidecar_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf, which must name rpst_sidecar before the first push).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: rpst_sidecar
      dockerfile: packages/rpst_sidecar/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump-rpst-sidecar:
    name: Trigger docker-apps bump (rpst-sidecar)
    needs: push-image-rpst-sidecar
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the rpst_sidecar pin in docker-apps images/kustomization.yaml, shared by every pod with an rpst sidecar.
    with:
      bump_source: rpst-sidecar
      image: ${{ needs.push-image-rpst-sidecar.outputs.image }}
      image_tag: ${{ needs.push-image-rpst-sidecar.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Pin: images/kustomization.yaml (iad.ocir.io/tnoff/audit_watch), bumped by the job below.
  push-image-audit-watch:
    name: Push audit-watch image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.audit_watch_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    # Logs in to OCIR with a short-lived token from this job's GitHub OIDC identity, not a stored
    # credential (tnoff/terraform#180). OCI maps this repo's push to main to a user that may push
    # only this repo's OCIR repositories (terraform-admin ocir-pushers.tf, which must name audit_watch before the first push).
    permissions:
      contents: read
      id-token: write
    uses: tnoff/github-workflows/.github/workflows/docker-push-oidc.yml@5a6f80dffddfa833301b438ec9b2052d7f2c24f2  # docker-push-oidc-v1.0.0
    with:
      oidc_exchange_domain_url: ${{ vars.OIDC_EXCHANGE_DOMAIN_URL }}
      oidc_exchange_client_id: ${{ vars.OIDC_EXCHANGE_CLIENT_ID }}
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: audit_watch
      dockerfile: packages/audit_watch/Dockerfile
    secrets:
      oidc_exchange_client_secret: ${{ secrets.OIDC_EXCHANGE_CLIENT_SECRET }}
      oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

  trigger-bump-audit-watch:
    name: Trigger docker-apps bump (audit-watch)
    needs: push-image-audit-watch
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@c804443f159eee3ebaece0dc57174cfc3387f4b3  # trigger-bump-dispatch-v1.0.1
    # Rewrites the audit_watch pin in docker-apps images/kustomization.yaml (monitoring/audit-watch). docker-apps'
    # bump-image-pin.yml must map the `audit-watch` source first, or the dispatch fails there.
    with:
      bump_source: audit-watch
      image: ${{ needs.push-image-audit-watch.outputs.image }}
      image_tag: ${{ needs.push-image-audit-watch.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
