name: Release

# Default-branch pipeline: fold the changelog, tag, push the image, and ask
# docker-apps to bump its pin.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag, because tag defers while fragments are still pending.
#
# The image must NOT be pushed twice and docker-apps must not be asked to bump
# twice. GitLab guarded this with .not-on-changelog-fold matching the commit
# message; this is the same guard. Without it the fold commit is byte-identical
# in the image context, so the push skips the tag write on a shared digest and
# trigger-bump pins docker-apps at a tag that was never written.
#
# There is no release job: the GitLab config included no release template.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Skip the image build when the commit did not touch anything the image is
  # built from. Without this a metadata-only merge -- a catalog descriptor, a
  # README -- folds a changelog, cuts a tag, rebuilds the image and bumps a
  # production pin in docker-apps for content no image contains.
  #
  # The same filter already exists in ci.yml as the `changes` job, and it works:
  # the build correctly skips on a docs-only PR. It was never wired into the
  # release path, so the saving stopped at the PR and the merge rebuilt anyway.
  # That is the shape worth remembering -- a control present where you watch the
  # checks and absent where the work actually happens.
  #
  # The keep-list below is copied from ci.yml's `changes` job and must stay
  # identical to it. If the two drift, a PR can build an image that its own merge
  # then refuses to rebuild.
  #
  # Two differences from ci.yml's copy, both forced by the event: the base is
  # github.event.before compared two-dot rather than a PR base ref, and this one
  # FAILS OPEN. An absent, all-zeros or unreachable base builds anyway. A build
  # that did not need to happen costs minutes; a build that silently did not
  # happen leaves docker-apps pinned to a stale image and reads exactly like a
  # successful run.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      secret_age_image: ${{ steps.filter.outputs.secret_age_image }}
      ocir_cleanup_image: ${{ steps.filter.outputs.ocir_cleanup_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Keep in lockstep with ci.yml's copy of this filter -- see that file's
      # header comment on why drift here is the way an image ships that its
      # own merge then refuses to rebuild.
      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base ref (${BEFORE:-empty}) -- building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "secret_age_image=true" >> "$GITHUB_OUTPUT"
            echo "ocir_cleanup_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          IMAGE=false
          SECRET_AGE_IMAGE=false
          OCIR_CLEANUP_IMAGE=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              packages/core/*|packages/scan/*) IMAGE=true ;;
            esac
            case "$f" in
              packages/core/*|packages/secret_age/*) SECRET_AGE_IMAGE=true ;;
            esac
            case "$f" in
              packages/core/*|packages/ocir_cleanup/*) OCIR_CLEANUP_IMAGE=true ;;
            esac
          done <<< "${FILES}"
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "image inputs changed: ${IMAGE}"
          echo "secret-age image inputs changed: ${SECRET_AGE_IMAGE}"
          echo "ocir-cleanup image inputs changed: ${OCIR_CLEANUP_IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "secret_age_image=${SECRET_AGE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ocir_cleanup_image=${OCIR_CLEANUP_IMAGE}" >> "$GITHUB_OUTPUT"

  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@93f9034849dfd1d98ed72629241a503d29842205  # assemble-changelog-v1.1.0
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # tag-v1.0.0
    with:
      gate_on_fragments: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  push-image:
    name: Push image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@a5e07a72bb76a983408e840c3cfcffa27cdbf738  # docker-push-v1.1.0
    # registry / namespace / repo_name are INPUTS, not secrets. GitHub refuses
    # to set a job output containing secret material, so as secrets the `image`
    # output below comes back EMPTY and trigger-bump sends a blank IMAGE_NAME.
    # See github-workflows!98.
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: oke-scan
      dockerfile: packages/scan/Dockerfile
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump:
    name: Trigger docker-apps bump
    needs: push-image
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # trigger-bump-dispatch-v1.0.0
    # Rewrites the pin in docker-apps apps/security-scanner/cronjob.yaml.
    with:
      bump_source: oke-scan
      image: ${{ needs.push-image.outputs.image }}
      image_tag: ${{ needs.push-image.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # A separate explicit job, not a matrix leg: matrix job outputs aren't
  # addressable per-leg (needs.push.outputs[matrix.image] doesn't exist), and
  # trigger-bump needs the exact tag its own paired push produced -- deriving
  # that independently is how a pin ends up pointing at a tag that was never
  # written. Same shape discord-bot uses for its own per-image push/bump pairs.
  push-image-secret-age:
    name: Push secret-age image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.secret_age_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@a5e07a72bb76a983408e840c3cfcffa27cdbf738  # docker-push-v1.1.0
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: secret_age_tracker
      dockerfile: packages/secret_age/Dockerfile
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump-secret-age:
    name: Trigger docker-apps bump (secret-age)
    needs: push-image-secret-age
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # trigger-bump-dispatch-v1.0.0
    # Rewrites the pin in docker-apps apps/security-scanner/secret-age-tracker-cronjob.yaml.
    with:
      bump_source: secret-age-tracker
      image: ${{ needs.push-image-secret-age.outputs.image }}
      image_tag: ${{ needs.push-image-secret-age.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  push-image-ocir-cleanup:
    name: Push ocir-cleanup image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.ocir_cleanup_image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@a5e07a72bb76a983408e840c3cfcffa27cdbf738  # docker-push-v1.1.0
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ocir_cleanup
      dockerfile: packages/ocir_cleanup/Dockerfile
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump-ocir-cleanup:
    name: Trigger docker-apps bump (ocir-cleanup)
    needs: push-image-ocir-cleanup
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # trigger-bump-dispatch-v1.0.0
    # Rewrites the pin in docker-apps images/kustomization.yaml for the
    # ocir_cleanup image, consumed by
    # apps/security-scanner/ocir-cleanup-cronjob.yaml (renamed from
    # cleanup-all.yaml).
    with:
      bump_source: ocir-cleanup
      image: ${{ needs.push-image-ocir-cleanup.outputs.image }}
      image_tag: ${{ needs.push-image-ocir-cleanup.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
