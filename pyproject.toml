[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# No importable code lives here any more -- the scan package moved to
# packages/scan/ to match core/secret_age/ocir_cleanup
# (docs/projects/oke-security-scanner-package-split.md). This project
# exists only so tox's default testenv has something to build+install for
# its `dev` extra (the actual tool versions below), and to host the
# `[tool.pylint.*]`/`[tool.bandit]`-style config tox's combined lint/scan
# invocations read from repo-root cwd. Named `-dev` rather than
# `oke-utilities` (the repo) or `oke-scan` (packages/scan's own pip name)
# so it can't collide with either in the same tox venv.
name = "oke-utilities-dev"
# Single source of truth: read from the VERSION file (CI bumps it via the
# bump-version job in .github/workflows/ci.yml; release.yml tags from it).
# That workflow reads/writes VERSION directly as text, never this pyproject
# -- this dynamic-version wiring is only for a local `pip install .` at repo
# root, which nothing does anymore, but it's left in place rather than
# ripped out along with everything else that changed here.
dynamic = ["version"]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "bandit",
    "coverage==7.16.2",
    "pylint==4.1.2",
    "tox==4.64.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
packages = []

[tool.pylint.main]
jobs = 0
persistent = true
recursive = true

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-statements",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "line-too-long",
    "logging-fstring-interpolation",
    "broad-exception-caught",
    "too-many-return-statements",
    "protected-access",
    "too-many-nested-blocks",
]

[tool.pylint.format]
max-line-length = 120
indent-string = "    "

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "e", "f", "db", "ns", "cfg"]

[tool.pylint.design]
max-args = 8
max-locals = 20

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint.imports]
allow-wildcard-with-all = false
