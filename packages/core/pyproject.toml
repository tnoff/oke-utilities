[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oke-scanner-core"
# Read from VERSION beside this file -- that is what CI bumps and tags.
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "kubernetes==37.0.3",
    "requests",
]

[project.optional-dependencies]
# oke_scanner_core.telemetry -- kept out of the base dependency set so
# secret_age (bare `oke-scanner-core`, no OpenTelemetry setup at all)
# doesn't pull in the SDK/exporters it never uses.
telemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-logging",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
