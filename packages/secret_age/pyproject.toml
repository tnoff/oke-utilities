[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-age-tracker"
# Read from VERSION beside this file -- that is what CI bumps and tags.
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    # core ships as its own release: pinned to its core-vX.Y.Z tag tarball,
    # bumped by Renovate (renovate.json). Keep scan, secret_age and
    # ocir_cleanup on the SAME tag -- tox installs all three in one env.
    "oke-scanner-core @ https://github.com/tnoff/oke-utilities/archive/refs/tags/core-v0.3.0.tar.gz#subdirectory=packages/core",
    "kubernetes==37.0.3",
    "oci==2.192.0",
    "requests",
    # dappertable is GitHub-canonical. The GitLab copy still resolves, but its
    # tags stop at v1.1.5 while GitHub is on v1.1.6, so this pin could never be
    # bumped past the freeze. Verified installable at 1.1.4 from this URL.
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.1.14.tar.gz",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "pylint==4.1.4",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pylint.*] here -- tox's combined `pylint packages/core/src
# packages/secret_age/src ...` invocation runs from the repo root, and
# pylint discovers config from CWD, so root pyproject.toml's blocks are
# the ones actually in effect. A duplicate copy here previously looked
# load-bearing but wasn't; removed rather than left to drift
# (packages/core never had one either).
