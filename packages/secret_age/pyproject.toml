[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-age-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "oke-scanner-core",
    "kubernetes==37.0.1",
    "oci==2.189.0",
    "requests",
    # dappertable is GitHub-canonical. The GitLab copy still resolves, but its
    # tags stop at v1.1.5 while GitHub is on v1.1.6, so this pin could never be
    # bumped past the freeze. Verified installable at 1.1.4 from this URL.
    "dappertable @ https://github.com/tnoff/dappertable/archive/refs/tags/v1.1.13.tar.gz",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# No [tool.pylint.*] here -- tox's combined `pylint packages/core/src
# packages/secret_age/src ...` invocation runs from the repo root, and
# pylint discovers config from CWD, so root pyproject.toml's blocks are
# the ones actually in effect. A duplicate copy here previously looked
# load-bearing but wasn't; removed rather than left to drift
# (packages/core never had one either).
