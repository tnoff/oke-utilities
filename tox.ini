[tox]
envlist = py311,py312,py313,py314

# Four separate installable packages under packages/ (see
# docs/projects/oke-security-scanner-package-split.md): core, scan,
# secret_age, ocir_cleanup. None of them carries its own dev-tool versions
# or pylint config -- core never did, and secret_age/ocir_cleanup's copies
# of both were found to be dead weight when scan joined them (tox always
# installs the ROOT project's `dev` extra and always lints from the repo
# root, so pylint reads root pyproject.toml's config regardless of what any
# package's own pyproject.toml says). Root pyproject.toml is the one
# real source for both: no importable code of its own, but it's what tox
# installs by default and what pylint/bandit read their config from.
#
# All four packages are editable-installed alongside that empty root
# project so their code is importable and covered in the same run.
# core[telemetry] pulls in the OpenTelemetry SDK for scan and
# packages/ocir_cleanup, which both need it; secret_age never requests that
# extra and stays free of it.
#
# Each package's tests run as a SEPARATE pytest invocation (four `coverage
# run --parallel-mode` calls, then `coverage combine`), not one combined
# `pytest packages/*/tests/` call. All four test dirs are named `tests`,
# and collecting them in one pytest invocation raises
# `ImportPathMismatchError` / "Plugin already registered" on the duplicate
# `tests.conftest` module name once more than one carries an `__init__.py`.
# `--import-mode=importlib` sidesteps that collision but silently breaks
# coverage instead: pytest's default "prepend" mode inserts the repo root
# at sys.path[0], which is the (undocumented but load-bearing) reason
# `import scan.config` resolves to the editable-installed local source tree
# rather than a stale copy; `--import-mode=importlib` does not do that.
# Separate invocations keep each package's own default-mode sys.path
# behavior intact without needing that flag at all.
[testenv]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/scan
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
    -e {toxinidir}/packages/jwks_publisher
    -e {toxinidir}/packages/rpst_sidecar
    -e {toxinidir}/packages/audit_watch
commands =
    coverage erase
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/scan/src -m pytest packages/scan/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage run --parallel-mode --source=packages/ocir_cleanup/src -m pytest packages/ocir_cleanup/tests/ -v
    coverage run --parallel-mode --source=packages/jwks_publisher/src -m pytest packages/jwks_publisher/tests/ -v
    coverage run --parallel-mode --source=packages/rpst_sidecar/src -m pytest packages/rpst_sidecar/tests/ -v
    coverage run --parallel-mode --source=packages/audit_watch/src -m pytest packages/audit_watch/tests/ -v
    coverage combine
    coverage report -m
    coverage xml
    py314: pylint packages/core/src packages/scan/src packages/secret_age/src packages/ocir_cleanup/src packages/jwks_publisher/src packages/rpst_sidecar/src packages/audit_watch/src
    py314: bandit -r packages/core/src packages/scan/src packages/secret_age/src packages/ocir_cleanup/src packages/jwks_publisher/src packages/rpst_sidecar/src packages/audit_watch/src

[testenv:pylint]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/scan
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
    -e {toxinidir}/packages/jwks_publisher
    -e {toxinidir}/packages/rpst_sidecar
    -e {toxinidir}/packages/audit_watch
commands = pylint packages/core/src packages/scan/src packages/secret_age/src packages/ocir_cleanup/src packages/jwks_publisher/src packages/rpst_sidecar/src packages/audit_watch/src

[testenv:pytest]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/scan
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
    -e {toxinidir}/packages/jwks_publisher
    -e {toxinidir}/packages/rpst_sidecar
    -e {toxinidir}/packages/audit_watch
commands =
    coverage erase
    coverage run --parallel-mode --source=packages/core/src -m pytest packages/core/tests/ -v
    coverage run --parallel-mode --source=packages/scan/src -m pytest packages/scan/tests/ -v
    coverage run --parallel-mode --source=packages/secret_age/src -m pytest packages/secret_age/tests/ -v
    coverage run --parallel-mode --source=packages/ocir_cleanup/src -m pytest packages/ocir_cleanup/tests/ -v
    coverage run --parallel-mode --source=packages/jwks_publisher/src -m pytest packages/jwks_publisher/tests/ -v
    coverage run --parallel-mode --source=packages/rpst_sidecar/src -m pytest packages/rpst_sidecar/tests/ -v
    coverage run --parallel-mode --source=packages/audit_watch/src -m pytest packages/audit_watch/tests/ -v
    coverage combine
    coverage report -m
    coverage html

[testenv:bandit]
extras = dev
deps =
    -e {toxinidir}/packages/core[telemetry]
    -e {toxinidir}/packages/scan
    -e {toxinidir}/packages/secret_age
    -e {toxinidir}/packages/ocir_cleanup
    -e {toxinidir}/packages/jwks_publisher
    -e {toxinidir}/packages/rpst_sidecar
    -e {toxinidir}/packages/audit_watch
commands = bandit -r packages/core/src packages/scan/src packages/secret_age/src packages/ocir_cleanup/src packages/jwks_publisher/src packages/rpst_sidecar/src packages/audit_watch/src
