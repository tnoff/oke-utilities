# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
#
# github.com/project-slug is DERIVED by the portal's
# AnnotateScmSlugEntityProcessor from the location this file was fetched from.
# techdocs-ref is set below now that mkdocs.yml + docs/ exist; the kubernetes
# / grafana selectors still assert targets that don't exist yet, so they stay
# out until those plugins are wired up.
#
# Six library Components now: one per real deployable (oke-scan,
# secret-age-tracker, ocir-cleanup, jwks-publisher, rpst-sidecar, audit-watch) plus the shared
# oke-scanner-core (docs/projects/oke-security-scanner-package-split.md), where
# there used to be one standing in for all three CronJobs' image. Each of the three
# CronJob Components in docker-apps' own catalog-info.yaml should
# dependsOn its own library here, not all three on this one -- that edge
# lives in docker-apps' descriptor, updated separately.
#
# This library is named secret-age-tracker, matching the package -- the naming
# collision that would create (docker-apps' catalog-info.yaml already has a
# service Component of that name for the CronJob; Backstage entity identity is
# (kind, namespace, name), spec.type isn't part of it) is resolved on the
# docker-apps side instead: that Component is renamed to
# secret-age-tracker-cronjob there, following the same
# name-doesn't-match-the-k8s-resource shape already documented for the
# magic-mirror Components (backstage.io/kubernetes-id, not literal name
# equality, is the intended fix once the Kubernetes plugin is wired up).
#
# techdocs-ref stays on oke-scan only -- one canonical entity per repo
# should own a given TechDocs site, not all four.
#
# This library was renamed from oke-security-scanner to oke-scan, and the
# repo itself from oke-security-scanner to oke-utilities, once it was clear
# "oke-security-scanner" was doing double duty as both the repo name and
# one specific package's name -- the repo now holds three sibling
# CronJob packages, and the scanner is no longer special among them.
# github.com/project-slug re-derives from the renamed repo's URL
# automatically; nothing else here needed touching for that half.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oke-scan
  description: >-
    Discovers all images actually deployed in OKE and scans each with Trivy, reporting
    over OpenTelemetry. Just the scan package (packages/scan/); cleanup,
    secret-age-tracking, the JWKS publisher and the RPST sidecar are their own libraries below.
  annotations:
    backstage.io/techdocs-ref: dir:.
  # `library` rather than `service`, changed once the CronJob Components in docker-apps
  # existed. Same call, same reasoning, as database-backup#226: while nothing in the
  # catalog represented the deployed thing, this entity had to stand in for it.
  #
  # `library` is not limited to pip-installable packages. MMM-BartTimes is `library` and
  # is a MagicMirror JS module baked into magic-mirror-docker's image; the working
  # definition is "a thing other components consume rather than a thing that runs on its
  # own". An image invoked from a CronJob is that.
  #
  # No spec.system, matching database-backup and every other library here. The CronJobs
  # have none either -- see the note in docker-apps' descriptor for why no System was
  # invented for them.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/github-workflows
    - component:default/oke-scanner-core
  consumesApis:
    - api:default/image-bump
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: oke-scanner-core
  description: >-
    Shared code underneath the three of this repo's libraries that use it (the JWKS
    publisher and RPST sidecar stand alone): k8s in-cluster/
    kubeconfig-fallback auth, image discovery (KubernetesClient, the Image dataclass),
    and the low-level Discord webhook client. Never deployed or built into an image on
    its own -- packages/core, installed alongside whichever package actually ships.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: secret-age-tracker
  description: >-
    Reports secrets ≥90 days old across OCI IAM credentials, Kubernetes Secrets, and
    operator-tracked admin tfvars (via a layer-1 ledger ConfigMap). Its own package
    (packages/secret_age/) and its own image; no Trivy, no OCIR cleanup code, no
    OpenTelemetry at all (plain stdout logging). See the README's "Secret-age
    tracker" section for the feature itself.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/oke-scanner-core
  consumesApis:
    - api:default/image-bump
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ocir-cleanup
  description: >-
    Prunes stale OCIR tags beyond a configurable keep_count and removes orphaned
    platform manifests, protecting the deployed tag, latest, and any multi-arch
    sub-manifest digests referenced by kept tags. Its own package
    (packages/ocir_cleanup/) and its own image; no Trivy binary, but does use the
    OpenTelemetry SDK (unlike secret-age-tracker -- the ocir-cleanup-cronjob
    CronJob genuinely enables OTLP metrics + logs).
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/dappertable
    - component:default/oke-scanner-core
  consumesApis:
    - api:default/image-bump
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: jwks-publisher
  description: >-
    Mirrors the cluster's ServiceAccount public key set into the public Object Storage
    object that OCI Identity Domains fetches on every token exchange, because the API
    server is private (tnoff/terraform#191). Its own package (packages/jwks_publisher/)
    and its own image; stands alone, with no oke-scanner-core, kubernetes client or
    OpenTelemetry (plain stdout logging). Refuses any key carrying private material and
    can only overwrite the one object it was seeded with. See the README's "JWKS
    publisher" section.
spec:
  type: library
  # experimental until the image is pushed and the CronJob runs in docker-apps; the
  # consumesApis edge to image-bump is added with the release job that triggers it.
  owner: group:default/admin
  lifecycle: experimental
  dependsOn:
    # Creates the bucket, the seeded object and the bot this job writes as.
    - component:default/terraform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rpst-sidecar
  description: >-
    Sidecar container that trades a pod's projected ServiceAccount token for an OCI
    resource principal session token (RPST) on a loop and writes it, with its private
    key, to a shared in-memory volume, so the main container can sign OCI SDK calls
    without a stored API key (tnoff/terraform#191). Its own package (packages/rpst_sidecar/)
    and its own image; stands alone, with only `cryptography` as a dependency (urllib for
    HTTP, no OCI SDK). See the README's "RPST sidecar" section.
spec:
  type: library
  # experimental until the image is pushed and a workload runs it from docker-apps; the
  # consumesApis edge to image-bump is added with the release job that triggers it.
  owner: group:default/admin
  lifecycle: experimental
  dependsOn:
    # Creates the identity domain, the token-exchange app and the policies this trades against.
    - component:default/terraform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: audit-watch
  description: >-
    CronJob that summarises what OCI resource principals did in the Audit log and warns on
    denied calls and unexpected writes (tnoff/terraform#191). Its own package
    (packages/audit_watch/) and image; the OCI SDK is its only dependency. Authenticates as a
    resource principal through the rpst sidecar. See the README's "Audit watch" section.
spec:
  type: service
  owner: group:default/admin
  lifecycle: experimental
  dependsOn:
    - component:default/rpst-sidecar
    - component:default/terraform
